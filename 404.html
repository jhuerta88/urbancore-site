<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Urban Core</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000416">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<header style="position:absolute;top:0;left:0;right:0;z-index:2;padding:18px 5%">
  <a href="/" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none" aria-label="Urban Core — ir al inicio">
    <svg width="32" height="32" viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <line x1="6" y1="30" x2="54" y2="30" stroke="#378add" stroke-width="0.9" opacity="0.55"></line>
      <line x1="30" y1="6" x2="30" y2="54" stroke="#378add" stroke-width="0.9" opacity="0.55"></line>
      <circle cx="30" cy="30" r="24" stroke="#185fa5" stroke-width="1.5" fill="none"></circle>
      <circle cx="30" cy="30" r="13" stroke="#378add" stroke-width="1.5" fill="none"></circle>
      <circle cx="30" cy="6" r="3" fill="#85b7eb"></circle><circle cx="30" cy="54" r="3" fill="#85b7eb"></circle>
      <circle cx="54" cy="30" r="3" fill="#85b7eb"></circle><circle cx="6" cy="30" r="3" fill="#85b7eb"></circle>
      <circle cx="47" cy="13" r="2.5" fill="#378add" fill-opacity="0.6"></circle><circle cx="13" cy="13" r="2.5" fill="#378add" fill-opacity="0.6"></circle>
      <circle cx="47" cy="47" r="2.5" fill="#378add" fill-opacity="0.6"></circle><circle cx="13" cy="47" r="2.5" fill="#378add" fill-opacity="0.6"></circle>
      <circle cx="30" cy="30" r="3.5" fill="#378add"></circle>
    </svg>
    <span style="font-size:19px;line-height:1;font-family:var(--font-display)"><span style="font-weight:300;color:var(--text-tertiary-on-dark)">Urban</span><span style="font-weight:600;color:var(--accent-structural)">Core</span></span>
  </a>
</header>

<main style="position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:var(--surface-base);box-sizing:border-box">

  <!-- Orbital intacto: el mismo del hero. La marca no está rota; lo que falta
       es la página, y eso lo dice el texto. -->
  <div class="uc-404-orbit" aria-hidden="true" style="position:absolute;right:-8%;top:50%;transform:translateY(-50%);width:min(760px,60vw);height:min(760px,60vw);pointer-events:none;mask-image:linear-gradient(to left, black 55%, transparent 92%);-webkit-mask-image:linear-gradient(to left, black 55%, transparent 92%)">
    <div style="position:absolute;inset:0;background:radial-gradient(circle, rgba(55,138,221,0.16) 0%, rgba(55,138,221,0.05) 40%, transparent 74%)"></div>
    <svg style="width:100%;height:100%;filter:drop-shadow(0 0 34px rgba(55,138,221,0.24))" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="4" y1="50" x2="96" y2="50" stroke="#378add" stroke-width="0.5" opacity="0.28"></line>
      <line x1="50" y1="2" x2="50" y2="98" stroke="#378add" stroke-width="0.5" opacity="0.28"></line>
      <circle cx="50" cy="50" r="48" stroke="#185fa5" stroke-width="0.8" opacity="0.4" fill="none"></circle>
      <g class="uc-ring-outer">
        <circle cx="50" cy="50" r="38" stroke="#185fa5" stroke-width="1.3" fill="none"></circle>
        <circle cx="50" cy="12" r="3.6" fill="#85b7eb"></circle><circle cx="50" cy="88" r="3.6" fill="#85b7eb"></circle>
        <circle cx="12" cy="50" r="3.6" fill="#85b7eb"></circle><circle cx="88" cy="50" r="3.6" fill="#85b7eb"></circle>
        <circle cx="76.8" cy="23.2" r="2.7" fill="#378add" fill-opacity="0.6"></circle><circle cx="23.2" cy="23.2" r="2.7" fill="#378add" fill-opacity="0.6"></circle>
        <circle cx="76.8" cy="76.8" r="2.7" fill="#378add" fill-opacity="0.6"></circle><circle cx="23.2" cy="76.8" r="2.7" fill="#378add" fill-opacity="0.6"></circle>
      </g>
      <g class="uc-ring-inner">
        <circle cx="50" cy="50" r="20" stroke="#378add" stroke-width="1.3" fill="none"></circle>
        <circle cx="50" cy="30" r="2.6" fill="#378add" fill-opacity="0.85"></circle><circle cx="50" cy="70" r="2.6" fill="#378add" fill-opacity="0.85"></circle>
        <circle cx="30" cy="50" r="2.6" fill="#378add" fill-opacity="0.85"></circle><circle cx="70" cy="50" r="2.6" fill="#378add" fill-opacity="0.85"></circle>
      </g>
      <circle cx="50" cy="50" r="5.5" fill="#378add"></circle>
    </svg>
  </div>

  <div class="uc2-hero-scrim" aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(190deg, rgba(0,4,22,0.6) 0%, rgba(0,4,22,0.32) 45%, transparent 72%);pointer-events:none"></div>

  <div class="uc-404-inner" style="position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:104px 5% 72px;width:100%;box-sizing:border-box">
    <div style="max-width:620px">
      <span class="kicker" style="display:block;margin-bottom:18px">Error 404</span>
      <p class="uc-404-code" aria-hidden="true" style="font-family:var(--font-mono);font-size:clamp(64px,11vw,132px);line-height:0.9;color:var(--accent-structural);margin:0 0 12px;letter-spacing:-0.02em;opacity:0.45">404</p>
      <h1 style="margin-bottom:18px;color:var(--text-primary-on-dark);font-size:clamp(34px,5.5vw,60px);line-height:1.08;letter-spacing:0.01em">Esta página no existe</h1>
      <p style="color:var(--text-tertiary-on-dark);font-size:18px;line-height:1.7;margin-bottom:34px;font-weight:300;max-width:500px">El enlace puede estar roto o la página cambió de lugar. Nada que no podamos arreglar.</p>

      <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:40px">
        <a href="/" class="uc-btn-primary" style="background:var(--accent-interactive);color:var(--text-primary-on-dark);text-decoration:none;font-size:15.5px;font-weight:600;padding:17px 34px;border-radius:var(--radius-cta);transition:background var(--duration-ui) var(--ease-out), transform var(--duration-ui) var(--ease-out), box-shadow var(--duration-ui) var(--ease-out)">Volver al inicio</a>
        <a href="/#contacto" class="uc-link-accent" style="display:inline-flex;align-items:center;gap:8px;color:var(--accent-interactive);text-decoration:none;font-size:14px;font-weight:600;font-family:var(--font-display)">Habla con nosotros <span aria-hidden="true">→</span></a>
      </div>

      <nav aria-label="Secciones del sitio" style="padding-top:28px;border-top:1px solid var(--border-structural-subtle)">
        <span style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-tertiary-on-dark);font-weight:300;margin-bottom:16px">O ve directo a</span>
        <ul style="display:flex;gap:28px;list-style:none;margin:0;padding:0;flex-wrap:wrap">
          <li><a href="/#servicios" class="uc-link-muted" style="display:inline-flex;align-items:baseline;gap:7px;color:var(--text-secondary-on-dark);text-decoration:none;font-size:14px;font-family:var(--font-display)"><span style="font-family:var(--font-mono);font-size:11px;color:var(--accent-structural)">01</span>Servicios</a></li>
          <li><a href="/#nosotros" class="uc-link-muted" style="display:inline-flex;align-items:baseline;gap:7px;color:var(--text-secondary-on-dark);text-decoration:none;font-size:14px;font-family:var(--font-display)"><span style="font-family:var(--font-mono);font-size:11px;color:var(--accent-structural)">02</span>Nosotros</a></li>
          <li><a href="/#faq" class="uc-link-muted" style="display:inline-flex;align-items:baseline;gap:7px;color:var(--text-secondary-on-dark);text-decoration:none;font-size:14px;font-family:var(--font-display)"><span style="font-family:var(--font-mono);font-size:11px;color:var(--accent-structural)">03</span>Preguntas</a></li>
          <li><a href="/#contacto" class="uc-link-muted" style="display:inline-flex;align-items:baseline;gap:7px;color:var(--text-secondary-on-dark);text-decoration:none;font-size:14px;font-family:var(--font-display)"><span style="font-family:var(--font-mono);font-size:11px;color:var(--accent-structural)">04</span>Contacto</a></li>
        </ul>
      </nav>
    </div>
  </div>
</main>

</body>
</html>
